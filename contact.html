<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact - Zaf Hossain</title>
  <meta name="description" content="Contact Zaf Hossain." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/zaffavicon (1).png" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Back to home">
      <span class="brand-text">Zaf Hossain</span>
    </a>

    <nav class="top-nav" aria-label="Site">
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page">
    <section class="contact-form-wrap" aria-label="Contact form">
      <div class="contact-layout">
        <form class="contact-form" action="#" method="post">
          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" />
          </div>

          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" />
          </div>

          <div class="contact-field">
            <label for="contact-phone">Phone</label>
            <input id="contact-phone" name="phone" type="tel" autocomplete="tel" />
          </div>

          <div class="contact-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="9"></textarea>
          </div>

          <div class="contact-actions">
            <button type="submit">Send</button>
          </div>
        </form>

        <aside class="contact-details" aria-label="Contact details">
          <p class="contact-details-kicker">Contact Details</p>
          <p class="contact-details-row">
            <span>Email:</span>
            <a href="mailto:zaf@zafhossain.com">zaf@zafhossain.com</a>
          </p>
          <img
            class="contact-details-image"
            src="assets/airport.png"
            alt="Airport project visual"
            loading="lazy"
          />
          <img
            class="contact-details-image"
            src="assets/background.png"
            alt="Background project visual"
            loading="lazy"
          />
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small>&copy; 2026 Zafrin Hossain</small>
  </footer>
</body>
</html>
